{% extends 'base.html' %}

{% block title %}Site Settings{% endblock %}

{% block content %}
<div class="container section-spacing admin-shell">
  <div class="section-heading project-heading">
    <div>
      <p class="eyebrow">Settings</p>
      <h1>Site Configuration</h1>
    </div>
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary small">Back</a>
  </div>

  <form method="post" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <label>Site Name<input type="text" name="site_name" value="{{ settings.site_name }}" /></label>
    <label>Email<input type="email" name="site_email" value="{{ settings.site_email }}" /></label>
    <label>GitHub URL<input type="url" name="github_url" value="{{ settings.github_url }}" /></label>
    <label>LinkedIn URL<input type="url" name="linkedin_url" value="{{ settings.linkedin_url }}" /></label>
    <label>Instagram URL<input type="url" name="instagram_url" value="{{ settings.instagram_url }}" /></label>
    <label>Twitter URL<input type="url" name="twitter_url" value="{{ settings.twitter_url }}" /></label>
    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
</div>
{% endblock %}
